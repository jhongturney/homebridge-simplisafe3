name: Node Tests

on:
  push:
  pull_request:
    branches: [master, main]
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node-version }}, Homebridge ${{ matrix.homebridge-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.12.0', 24, 26]
        homebridge-version: ['2.5.0']
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --ignore-scripts homebridge@${{ matrix.homebridge-version }}
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:webrtc
      - run: npm run test:http


  package:
    name: Package installation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: npm run test:package
